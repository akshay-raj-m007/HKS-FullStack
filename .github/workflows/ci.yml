name: Full-stack checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate -w backend
      - run: npm run check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hks
          POSTGRES_PASSWORD: hks_ci
          POSTGRES_DB: hks_checks
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://hks:hks_ci@localhost:5432/hks_checks
      DIRECT_DATABASE_URL: postgresql://hks:hks_ci@localhost:5432/hks_checks
      JWT_ACCESS_SECRET: ci-only-access-secret-never-use-for-deployment
      OTP_HASH_SECRET: ci-only-otp-secret-never-use-for-deployment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run neon:generate
      - run: npm run neon:migrate
      - run: npm run neon:seed
      - run: npm run neon:verify
