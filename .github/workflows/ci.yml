name: Full-stack checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate -w backend
      - run: npm run check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hks
          POSTGRES_PASSWORD: hks_ci
          POSTGRES_DB: hks_checks
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://hks:hks_ci@localhost:5432/hks_checks
      DIRECT_DATABASE_URL: postgresql://hks:hks_ci@localhost:5432/hks_checks
      JWT_ACCESS_SECRET: ci-only-access-secret-never-use-for-deployment
      OTP_HASH_SECRET: ci-only-otp-secret-never-use-for-deployment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run neon:generate
      - run: npm run neon:migrate
      - run: npm run neon:seed
      - run: npm run neon:verify
  deploy-render:
    needs: [local-app, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified commit to Render Free
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          node --input-type=module <<'NODE'
          try {
            if (!process.env.RENDER_DEPLOY_HOOK) throw new Error();
            const url = new URL(process.env.RENDER_DEPLOY_HOOK);
            if (url.origin !== 'https://api.render.com') throw new Error();
            url.searchParams.set('ref', process.env.GITHUB_SHA);
            const response = await fetch(url, { method: 'POST' });
            if (!response.ok) throw new Error();
            console.log('Render accepted deployment of verified commit ' + process.env.GITHUB_SHA);
          } catch {
            console.error('Render deployment could not be triggered. Configure the RENDER_DEPLOY_HOOK repository secret and check the service status.');
            process.exitCode = 1;
          }
          NODE
